<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" role="img" aria-label="Food Pack logo icon">
  <defs>
    <linearGradient id="bowlGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#4CAF50"/>
      <stop offset="1" stop-color="#2E7D32"/>
    </linearGradient>
    <linearGradient id="leafGrad" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#6CBF3B"/>
      <stop offset="1" stop-color="#9CD65A"/>
    </linearGradient>
  </defs>

  <!-- bowl body: bold half-disc, fills lower area -->
  <path d="M28 118 A72 72 0 0 0 172 118 Z" fill="url(#bowlGrad)"/>
  <!-- bowl rim: single light band, no inner ellipse / soil -->
  <ellipse cx="100" cy="118" rx="72" ry="13" fill="#66BB6A"/>

  <!-- stem: thicker -->
  <path d="M100 118 C96 96 106 80 100 54" fill="none" stroke="#3FA34D" stroke-width="11" stroke-linecap="round"/>

  <!-- two big leaves, fill upper area -->
  <path d="M100 62 C92 34 66 22 44 28 C50 54 76 68 100 62 Z" fill="url(#leafGrad)"/>
  <path d="M100 62 C108 34 134 22 156 28 C150 54 124 68 100 62 Z" fill="url(#leafGrad)"/>
</svg>
