<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" role="img" aria-label="Food Pack logo icon">
  <defs>
    <linearGradient id="rg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#B3D222"/><stop offset="1" stop-color="#97C537"/>
    </linearGradient>
    <linearGradient id="lg" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#A5CC30"/><stop offset="1" stop-color="#C6E12A"/>
    </linearGradient>
    <linearGradient id="sg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#7FB02C"/><stop offset="1" stop-color="#458015"/>
    </linearGradient>
  </defs>
  <g transform="translate(33.5 -0.95) scale(0.95)">
    <!-- ring = the letter O -->
    <circle cx="70" cy="125" r="57.75" fill="none" stroke="url(#rg)" stroke-width="24.5"/>
    <!-- bowl -->
    <path d="M33 170 A37 31 0 0 0 107 170 Z" fill="#72AA3A"/>
    <!-- soil mound -->
    <path d="M32 173 C42 158 56 160 70 164 C84 158 96 160 104 172 C80 179 54 179 32 173 Z" fill="#14401A"/>
    <!-- stem: curved, thick, light-top gradient -->
    <path d="M72 172 C69 150 77 134 72 110 C68 94 64 70 70 50" fill="none" stroke="url(#sg)" stroke-width="12" stroke-linecap="round"/>
    <!-- side leaf -->
    <path d="M75 112 C80 96 96 84 116 84 C112 102 94 114 75 112 Z" fill="#A9C93B"/>
    <!-- top leaves: fat almonds -->
    <path d="M70 50 C60 20 44 10 26 12 C38 26 56 42 70 50 Z" fill="url(#lg)"/>
    <path d="M70 50 C84 20 100 8 112 8 C104 26 86 42 70 50 Z" fill="url(#lg)"/>
  </g>
</svg>
